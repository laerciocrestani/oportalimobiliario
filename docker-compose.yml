services:
  postgres:
    image: postgres:16-alpine
    container_name: opim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oportalimobiliario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-oportalimobiliario}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oportalimobiliario} -d ${POSTGRES_DB:-oportalimobiliario}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: opim_backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://api.localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-oportalimobiliario}
      DB_USERNAME: ${POSTGRES_USER:-oportalimobiliario}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      CORS_ALLOWED_ORIGINS: "http://construtora.localhost:5173,http://corretor.localhost:5173,http://admin.localhost:5173,http://www.localhost:4321"
      SANCTUM_STATEFUL_DOMAINS: "construtora.localhost,corretor.localhost,admin.localhost,www.localhost,api.localhost"
      PUBLIC_SITE_URL: "http://www.localhost:4321"
    volumes:
      - ./backend:/var/www/html
      - ./sample:/var/www/sample:ro
      - ./.cursor:/var/www/html/.cursor

  frontend:
    image: node:22-bookworm
    container_name: opim_frontend
    working_dir: /usr/src/app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://api.localhost:8000/api
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    ports:
      - "5173:5173"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: opim_queue
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan queue:work --sleep=1 --tries=3
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://api.localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-oportalimobiliario}
      DB_USERNAME: ${POSTGRES_USER:-oportalimobiliario}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      QUEUE_CONNECTION: database
    volumes:
      - ./backend:/var/www/html

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: opim_scheduler
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan schedule:work
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://api.localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-oportalimobiliario}
      DB_USERNAME: ${POSTGRES_USER:-oportalimobiliario}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      QUEUE_CONNECTION: database
    volumes:
      - ./backend:/var/www/html

  sites:
    image: node:22-bookworm
    container_name: opim_sites
    working_dir: /usr/src/app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 4321"
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      PUBLIC_API_BASE_URL: "http://backend:8000/api"
      PUBLIC_SITE_URL: "http://www.localhost:4321"
      ASTRO_ADAPTER: node
    volumes:
      - ./sites:/usr/src/app
      - sites_node_modules:/usr/src/app/node_modules
    ports:
      - "4321:4321"

volumes:
  postgres_data:
  frontend_node_modules:
  sites_node_modules:

networks:
  default:
    name: opim_network
