openapi: 3.1.0
info:
  title: Oportalimobiliário API
  version: 0.4.0
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/public/buildings:
    get:
      summary: List published buildings (no auth)
      responses:
        '200':
          description: List of buildings with cheapest unit and cover image
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    slug:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    city:
                      type: string
                      nullable: true
                    state:
                      type: string
                      nullable: true
                    seo_title:
                      type: string
                      nullable: true
                    seo_description:
                      type: string
                      nullable: true
                    units_count:
                      type: integer
                    cheapest_unit:
                      type: object
                      nullable: true
                      properties:
                        code:
                          type: string
                        price:
                          type: string
                        area_m2:
                          type: string
                          nullable: true
                        floor:
                          type: integer
                          nullable: true
                    cover_image:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: integer
                        url:
                          type: string
  /api/public/buildings/{slug}:
    get:
      summary: Show published building by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Building detail
        '404':
          description: Not found
  /api/public/buildings/{slug}/media:
    get:
      summary: List published building media (internal/external only)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published media list
        '404':
          description: Building not found or not published
  /api/public/buildings/{slug}/media/{media}/file:
    get:
      summary: Stream published building media file
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
        '404':
          description: Not found
  /api/public/sitemap.xml:
    get:
      summary: Public sitemap XML
      responses:
        '200':
          description: Sitemap XML
          content:
            application/xml:
              schema:
                type: string
  /api/public/robots.txt:
    get:
      summary: Public robots.txt
      responses:
        '200':
          description: Robots rules
          content:
            text/plain:
              schema:
                type: string
  /api/auth/login:
    post:
      summary: Login
      responses:
        '200':
          description: Token issued
        '422':
          description: Invalid credentials
  /api/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthenticated
  /api/auth/impersonate/exchange:
    post:
      summary: Exchange one-time impersonation code for builder token (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Token issued for impersonated builder user
        '422':
          description: Invalid or expired code
  /api/builder/buildings:
    get:
      summary: List buildings (builder role)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant-scoped list with units_summary per building
    post:
      summary: Create building
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}:
    get:
      summary: Show building with towers, units and units_summary
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Building detail
        '404':
          description: Not found
  /api/builder/buildings/{building}/towers:
    get:
      summary: List towers for building
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Towers with units_summary
    post:
      summary: Create tower
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}/towers/{tower}:
    get:
      summary: Show tower with units and units_summary
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: tower
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tower detail
        '404':
          description: Not found
    put:
      summary: Update tower
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete tower
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '422':
          description: Tower has units
  /api/builder/buildings/{building}/units:
    get:
      summary: List units
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list
    post:
      summary: Create unit
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}/media:
    get:
      summary: List building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
            enum: [internal, external, floor_plan]
      responses:
        '200':
          description: Media list
    post:
      summary: Upload building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                  enum: [internal, external, floor_plan]
                published:
                  type: boolean
      responses:
        '201':
          description: Created
        '422':
          description: Validation error
  /api/builder/buildings/{building}/media/{media}:
    patch:
      summary: Update building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
        '422':
          description: Validation error
    delete:
      summary: Delete building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /api/builder/buildings/{building}/media/{media}/file:
    get:
      summary: Stream building media file
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
  /api/builder/invites:
    get:
      summary: List broker invites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invites with status and invite_url
    post:
      summary: Create broker invite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel]
              properties:
                name:
                  type: string
                channel:
                  type: string
                  enum: [email, whatsapp]
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        '201':
          description: Created with invite_url; dispatched via selected channel
  /api/builder/invites/{invite}/resend:
    post:
      summary: Resend broker invite
      security:
        - bearerAuth: []
      parameters:
        - name: invite
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resent with new token and updated last_sent_at
  /api/builder/invites/{invite}:
    delete:
      summary: Cancel pending broker invite
      security:
        - bearerAuth: []
      parameters:
        - name: invite
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /api/builder/invite-link:
    get:
      summary: Get or create tenant shareable invite link
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invite link with invite_url
  /api/builder/invite-link/regenerate:
    post:
      summary: Regenerate tenant shareable invite link token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New invite link
  /api/builder/pending-brokers:
    get:
      summary: List brokers pending approval from open invite link
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending broker requests
  /api/builder/pending-brokers/{brokerTenant}/approve:
    post:
      summary: Approve pending broker from open invite link
      security:
        - bearerAuth: []
      parameters:
        - name: brokerTenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Broker approved
  /api/builder/pending-brokers/{brokerTenant}/reject:
    post:
      summary: Reject pending broker from open invite link
      security:
        - bearerAuth: []
      parameters:
        - name: brokerTenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Request rejected
  /api/builder/brokers:
    get:
      summary: List linked brokers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brokers with buildings_count and buildings summary
  /api/builder/brokers/{broker}/buildings:
    get:
      summary: List buildings granted to broker
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Granted buildings
    post:
      summary: Grant broker access to building (all units)
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
        '403':
          description: Missing access.manage permission
    delete:
      summary: Revoke broker access to building
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Revoked
  /api/builder/team:
    get:
      summary: List builder team members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team members with permissions
        '403':
          description: Missing team.manage permission
    post:
      summary: Create builder team member
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
        '403':
          description: Missing team.manage permission
        '422':
          description: Validation error
  /api/builder/team/{teamMember}:
    patch:
      summary: Update builder team member
      security:
        - bearerAuth: []
      parameters:
        - name: teamMember
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
        '422':
          description: Validation error
    delete:
      summary: Remove builder team member
      security:
        - bearerAuth: []
      parameters:
        - name: teamMember
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden
        '422':
          description: Cannot remove last team manager
  /api/builder/reservations:
    get:
      summary: List reservations (builder)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservations list
        '403':
          description: Missing reservations.cancel permission
  /api/builder/reservations/pending-replies-count:
    get:
      summary: Count reservations awaiting builder reply
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending reply count
        '403':
          description: Missing reservations.cancel permission
  /api/builder/reservations/{reservation}/messages:
    get:
      summary: List reservation messages (builder)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Messages thread
        '403':
          description: Forbidden
    post:
      summary: Reply on reservation thread (builder)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Message created
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/builder/reservations/{reservation}:
    delete:
      summary: Cancel reservation (builder)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cancelled
        '403':
          description: Missing reservations.cancel permission
  /api/builder/reservations/{reservation}/timeline:
    get:
      summary: Get reservation timeline (builder)
      description: |
        Returns current stage, steps, and available actions for the manager.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Timeline with steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationTimeline'
        '403':
          description: Missing reservations.cancel permission
  /api/builder/reservations/{reservation}/proposal/decision:
    patch:
      summary: Decide on reservation proposal (builder)
      description: Accept, reject, or return the pending proposal to the broker.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [accepted, rejected, returned]
                decision_note:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '200':
          description: Decision recorded
        '403':
          description: Forbidden
        '422':
          description: Invalid stage or validation error
  /api/builder/reservations/{reservation}/deposit-proof/approve:
    patch:
      summary: Approve deposit proof (builder)
      description: Validates payment proof and advances reservation to contract data collection.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deposit proof approved
        '403':
          description: Forbidden
        '422':
          description: Invalid stage
  /api/builder/reservations/{reservation}/contract/issue:
    post:
      summary: Issue contract PDF (builder)
      description: Planned — emits contract PDF after document review.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Contract issued
        '403':
          description: Forbidden
        '422':
          description: Invalid stage
  /api/builder/reservations/{reservation}/contract/validate:
    patch:
      summary: Validate signed contract and mark unit sold (builder)
      description: Planned — final validation, builder GOV signature (manual v1), unit sold.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contract validated, unit sold
        '403':
          description: Forbidden
        '422':
          description: Invalid stage
  /api/broker/clients:
    get:
      summary: List broker clients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clients list
    post:
      summary: Create broker client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Created
  /api/broker/units:
    get:
      summary: List units by access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list
  /api/broker/buildings/{building}/media:
    get:
      summary: List building media for broker with access
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media list including floor plans
        '403':
          description: Forbidden
  /api/broker/buildings/{building}/media/{media}/file:
    get:
      summary: Stream building media file for broker
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
  /api/broker/reservations/pre-hold:
    post:
      summary: Create pre-hold reservation (10 min TTL)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_id
              properties:
                unit_id:
                  type: integer
      responses:
        '201':
          description: Pre-hold created
        '422':
          description: Unit not available
  /api/broker/reservations/{reservation}/confirm:
    patch:
      summary: Confirm pre-hold with client
      description: |
        Current v2 behavior — confirms reservation directly.
        Planned deprecation: will be replaced by POST /proposal (reservation-timeline Fase B).
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: integer
                observations:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '200':
          description: Reservation confirmed
        '422':
          description: Pre-hold expired or unit unavailable
  /api/broker/reservations/{reservation}/pre-hold:
    delete:
      summary: Release pre-hold without confirming
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Pre-hold released
  /api/broker/reservations:
    get:
      summary: List broker reservations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservations list for authenticated broker
    post:
      summary: Create soft reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_id
                - client_id
              properties:
                unit_id:
                  type: integer
                client_id:
                  type: integer
                observations:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '201':
          description: Created
  /api/broker/reservations/pending-replies-count:
    get:
      summary: Count reservations awaiting broker reply
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending reply count
  /api/broker/reservations/{reservation}/messages:
    get:
      summary: List reservation messages (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Messages thread
        '403':
          description: Not the reservation owner
    post:
      summary: Reply on reservation thread (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Message created
        '403':
          description: Not the reservation owner
        '422':
          description: Validation error
  /api/broker/reservations/{reservation}:
    delete:
      summary: Cancel reservation (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Reservation cancelled
        '403':
          description: Not the reservation owner
  /api/broker/reservations/{reservation}/timeline:
    get:
      summary: Get reservation timeline (broker)
      description: |
        Returns current stage, steps, and available actions for the broker.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Timeline with steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationTimeline'
        '403':
          description: Not the reservation owner
  /api/broker/reservations/{reservation}/proposal:
    post:
      summary: Submit reservation proposal (broker)
      description: |
        Sends client data snapshot and payment terms to the manager for approval.
        Replaces the legacy meaning of PATCH confirm (Fase B).
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationProposalInput'
      responses:
        '201':
          description: Proposal submitted
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage or validation error
  /api/broker/reservations/{reservation}/deposit-proof:
    post:
      summary: Upload deposit proof (broker)
      description: Attach payment proof after proposal accepted. Moves reservation to deposit_proof_pending.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Deposit proof uploaded
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage
  /api/broker/reservations/{reservation}/contract-data:
    post:
      summary: Submit contract data and documentation (broker)
      description: Planned — client data and ID document photos for contract drafting.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Contract data submitted
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage
  /api/broker/reservations/{reservation}/contract/signed:
    post:
      summary: Upload GOV-signed contract (broker)
      description: Planned — broker uploads contract signed via gov.br.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Signed contract uploaded
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage
  /api/broker/invites/preview:
    get:
      summary: Preview broker invite (public)
