      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Created
  /api/broker/units:
    get:
      summary: List units by access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list with INCC-M display `price`, `price_base`, `price_competence`, `price_incc_current` and amenities union
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/broker/buildings/{building}/media:
    get:
      summary: List building media for broker with access
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media list including floor plans
        '403':
          description: Forbidden
  /api/broker/buildings/{building}/media/{media}/file:
    get:
      summary: Stream building media file for broker
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
  /api/broker/reservations/pre-hold:
    post:
      summary: Create pre-hold reservation (10 min TTL)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_id
              properties:
                unit_id:
                  type: integer
      responses:
        '201':
          description: Pre-hold created
        '422':
          description: Unit not available
  /api/broker/reservations/{reservation}/confirm:
    patch:
      summary: Submit proposal (legacy alias of POST /proposal)
      description: |
        Alias of POST /api/broker/reservations/{reservation}/proposal.
        Prefer the POST endpoint. Multipart body with proposal fields and files[].
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationProposalSubmit'
      responses:
        '200':
          description: Proposal submitted (same effect as POST /proposal)
        '422':
          description: Pre-hold expired, invalid stage, or validation error
  /api/broker/reservations/{reservation}/pre-hold:
    patch:
      summary: Attach client to a pre-hold (simple pre-reservation form)
      description: |
        Confirms the pre-reservation by linking a broker client and optional
        observations (first dialogue message). Unit stays `pre_reserved`;
        status stays `pre_hold`. Starts a 48h hold window (`expires_at`).
        Does not submit a proposal.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: integer
                observations:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Client attached; 48h hold window starts
        '403':
          description: Not the owner or client does not belong to the broker
        '422':
          description: Not a pre-hold, expired, or unit no longer available
    delete:
      summary: Release pre-hold without confirming
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Pre-hold released
  /api/broker/reservations:
    get:
      summary: List broker reservations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservations list for authenticated broker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationListItem'
    post:
      summary: Create soft reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_id
                - client_id
              properties:
                unit_id:
                  type: integer
                client_id:
                  type: integer
                observations:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '201':
          description: Created
  /api/broker/reservations/pending-replies-count:
    get:
      summary: Count reservations awaiting broker reply
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending reply count
  /api/broker/reservations/pending-actions-count:
    get:
      summary: Count reservations with a pending in-app action for the current broker
      description: |
        Unique reservation count (reply, return signed proposal, upload contract, contract data, etc.).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending action count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPendingActionCount'
  /api/broker/reservations/{reservation}/messages:
    get:
      summary: List reservation messages (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Messages thread
        '403':
          description: Not the reservation owner
    post:
      summary: Reply on reservation thread (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Message created
        '403':
          description: Not the reservation owner
        '422':
          description: Validation error
  /api/broker/reservations/{reservation}:
    delete:
      summary: Cancel reservation (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '204':
          description: Reservation cancelled
        '403':
          description: Not the reservation owner
        '422':
          description: Validation error
  /api/broker/reservations/{reservation}/kanban:
    patch:
      summary: Move own reservation on the Kanban board
      description: |
        Same validation as the builder endpoint. The broker only moves reservations
        they own. Payload-heavy transitions return 422 `action_required`.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationKanbanMove'
      responses:
        '200':
          description: Column unchanged or transition applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationListItem'
        '204':
          description: Pre-hold without client released (deleted)
        '401':
          description: Unauthenticated
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid transition or action required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationKanbanError'
  /api/broker/reservations/{reservation}/timeline:
    get:
      summary: Get reservation timeline (broker)
      description: |
        Returns current stage, steps, and available actions for the broker.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Timeline with steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationTimeline'
        '403':
          description: Not the reservation owner
  /api/broker/reservations/{reservation}/proposal:
    post:
      summary: Submit reservation proposal (broker)
      description: |
        Sends client name, phone, commercial proposal terms and one or more
        attachments for the manager to review before accepting, returning or rejecting.
        Remaining client data is collected later in contract-data.
        Replaces the legacy meaning of PATCH confirm (Fase B).
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationProposalSubmit'
      responses:
        '201':
          description: Proposal submitted
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage or validation error
  /api/broker/reservations/{reservation}/proposal/signed:
    post:
      summary: Return proposal signed by both parties (broker)
      description: |
        Single submission after the builder accepted with a signed PDF.
        Requires `signed_file` (PDF). Optional `deposit_proof` when there is a deposit.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - signed_file
              properties:
                signed_file:
                  type: string
                  format: binary
                deposit_proof:
                  type: string
                  format: binary
      responses:
        '200':
          description: Signed proposal stored; deposit proof processed when sent
        '403':
          description: Not the reservation owner
        '422':
          description: Missing signed PDF or reservation not awaiting formalization
  /api/broker/reservations/{reservation}/deposit-proof:
    post:
      summary: Upload deposit proof (broker)
      description: Attach payment proof after proposal accepted. Moves reservation to deposit_proof_pending.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Deposit proof uploaded
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage
  /api/broker/reservations/{reservation}/contract-data:
    post:
      summary: Submit contract data and documentation (broker)
      description: Completes remaining client fields (name and phone already registered) and uploads ID document photos for contract drafting.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - client_cpf
                - client_rg
                - address
                - city
                - state
                - zip
                - marital_status
                - nationality
                - files
              properties:
                client_name:
                  type: string
                client_phone:
                  type: string
                client_email:
                  type: string
                  format: email
                client_cpf:
                  type: string
                  description: 11 digits with valid CPF check digits
                client_rg:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                zip:
                  type: string
                marital_status:
                  type: string
                  enum:
                    - Solteiro(a)
                    - Casado(a)
                    - Divorciado(a)
                    - Viúvo(a)
                    - Separado(a)
                nationality:
                  type: string
                spouse_name:
                  type: string
                spouse_phone:
                  type: string
                spouse_email:
                  type: string
                  format: email
                spouse_cpf:
                  type: string
                  description: 11 digits with valid CPF check digits when marital_status is Casado(a)
                spouse_rg:
                  type: string
                spouse_nationality:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Contract data submitted
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage or missing remaining client fields
  /api/broker/reservations/{reservation}/contract/gov:
    post:
      summary: Register GOV signature (broker)
      description: |
        Manual v1 record that client and broker signed the contract on GOV.
        Required before uploading the signed PDF.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '200':
          description: GOV signature registered
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage or already registered
  /api/broker/reservations/{reservation}/contract/signed:
    post:
      summary: Upload buyer-signed contract (broker)
      description: Broker uploads the contract PDF signed by the buyer after registering GOV.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Signed contract uploaded
        '403':
          description: Not the reservation owner
        '422':
          description: Invalid stage, missing GOV registration, or invalid file
  /api/broker/invites/preview:
    get:
      summary: Preview broker invite (public)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite preview
        '422':
          description: Invalid or expired
  /api/broker/invites/accept:
    post:
      summary: Accept broker invite and create account (public)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Accepted with auth token
  /api/broker/join/preview:
    get:
      summary: Preview open invite link (public)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Open link preview
        '422':
          description: Invalid link
  /api/broker/join/register:
    post:
      summary: Register broker via open invite link (public)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, name, phone, password]
              properties:
                token:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '201':
          description: Registered with auth token; pending builder approval
  /api/public/whatsapp/webhook:
    get:
      summary: Meta WhatsApp webhook verification
      responses:
        '200':
          description: Challenge echoed
    post:
      summary: Meta WhatsApp webhook events
      responses:
        '200':
          description: Event received
  /api/admin/activity:
    get:
      summary: List activity across all users and tenants
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
        - name: tenant_id
          in: query
          required: false
          schema:
            type: integer
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated activity events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserActivityEvent'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Missing or invalid date range
  /api/admin/activity/export:
    get:
      summary: Export activity as CSV
      description: Same filters as list. No period size cap. Streamed `text/csv`.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
        - name: tenant_id
          in: query
          required: false
          schema:
            type: integer
        - name: action
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: CSV download
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Missing or invalid date range
  /api/admin/tenants:
    get:
      summary: List tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated tenants
    post:
      summary: Create tenant
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/admin/tenants/{tenant}:
    get:
      summary: Show tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tenant with users_count
    put:
      summary: Update tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated tenant
        '422':
          description: Validation error
  /api/admin/tenants/{tenant}/users:
    get:
      summary: List builder users for tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Builder team members
        '403':
          description: Forbidden
  /api/admin/tenants/{tenant}/impersonate:
    post:
      summary: Generate one-time impersonation redirect URL
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: integer
      responses:
        '200':
          description: Redirect URL with one-time code
        '422':
          description: Invalid user or inactive tenant
        '403':
          description: Forbidden
  /api/admin/incc-indices:
    get:
      summary: List INCC-M indices (newest competence first)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: INCC-M rows ordered by competence descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InccIndex'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
    post:
      summary: Create an INCC-M index (manual)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competence, value]
              properties:
                competence:
                  type: string
                  format: date
                  description: Normalized to the first day of the month
                value:
                  type: number
                  description: Index number used in price ratios (not monthly %)
      responses:
        '201':
          description: Created with source=manual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InccIndex'
        '422':
          description: Validation error (duplicate competence)
  /api/admin/incc-indices/hint:
    get:
      summary: Latest INCC-M observation from BCB SGS (does not persist)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suggested competence and value. `is_index_number` is false when the series looks like monthly variation %.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InccHint'
        '404':
          description: BCB returned no observation
        '503':
          description: BCB SGS unavailable
  /api/admin/incc-indices/{inccIndex}:
    patch:
      summary: Update an INCC-M index
      security:
        - bearerAuth: []
      parameters:
        - name: inccIndex
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                competence:
                  type: string
                  format: date
                value:
                  type: number
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InccIndex'
        '404':
          description: Not found
        '422':
          description: Validation error
  /api/admin/amenities:
    get:
      summary: List amenity catalog (including inactive)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Amenities ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Amenity'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
    post:
      summary: Create amenity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: Optional; generated from name when omitted
                active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amenity'
        '422':
          description: Validation error
    patch:
      summary: Update amenity name or active flag
      security:
        - bearerAuth: []
      parameters:
        - name: amenity
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                active:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amenity'
        '404':
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Amenity:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        active:
          type: boolean
    InccIndex:
      type: object
      properties:
        id:
          type: integer
        competence:
          type: string
          format: date
        value:
          type: string
          description: Index number with 6 decimal places
        source:
          type: string
          enum: [job, manual]
        fetched_at:
          type: string
          format: date-time
          nullable: true
    InccHint:
      type: object
      properties:
        competence:
          type: string
          format: date
        value:
          type: string
