openapi: 3.1.0
info:
  title: Oportalimobiliário API
  version: 0.6.0
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/public/buildings:
    get:
      summary: List published buildings (no auth)
      responses:
        '200':
          description: List of buildings with cheapest unit and cover image
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicBuildingListItem'
  /api/public/buildings/{slug}:
    get:
      summary: Show published building by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Building detail with available units. Each unit `price` is the INCC-M display value, plus spec sheet fields (`bedrooms`, `area_m2`, `amenities` union).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBuildingDetail'
        '404':
          description: Not found
  /api/public/buildings/{slug}/media:
    get:
      summary: List published building media (internal/external only)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published media list
        '404':
          description: Building not found or not published
  /api/public/buildings/{slug}/media/{media}/file:
    get:
      summary: Stream published building media file
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
        '404':
          description: Not found
  /api/public/sitemap.xml:
    get:
      summary: Public sitemap XML
      responses:
        '200':
          description: Sitemap XML
          content:
            application/xml:
              schema:
                type: string
  /api/public/robots.txt:
    get:
      summary: Public robots.txt
      responses:
        '200':
          description: Robots rules
          content:
            text/plain:
              schema:
                type: string
  /api/auth/login:
    post:
      summary: Login
      responses:
        '200':
          description: Token issued
        '422':
          description: Invalid credentials
  /api/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthenticated
  /api/auth/impersonate/exchange:
    post:
      summary: Exchange one-time impersonation code for builder token (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Token issued for impersonated builder user
        '422':
          description: Invalid or expired code
  /api/builder/buildings:
    get:
      summary: List buildings (builder role)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant-scoped list with units_summary per building
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Building'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
    post:
      summary: Create building
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                seo_title:
                  type: string
                  nullable: true
                seo_description:
                  type: string
                  nullable: true
                zip:
                  type: string
                  description: CEP with 8 digits (hyphens accepted)
                street:
                  type: string
                  nullable: true
                number:
                  type: string
                  nullable: true
                complement:
                  type: string
                  nullable: true
                neighborhood:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                published:
                  type: boolean
                wizard_step:
                  type: integer
                  minimum: 1
                  maximum: 4
                ceiling_type:
                  type: string
                  nullable: true
                  enum: [plaster, pvc, wood, concrete, none]
                opening_type:
                  type: string
                  nullable: true
                  enum: [aluminum, wood, pvc, steel]
                flooring_type:
                  type: string
                  nullable: true
                  enum: [porcelain, ceramic, wood, vinyl, laminate, polished_concrete]
                solar_position:
                  type: string
                  nullable: true
                  enum: [north, northeast, east, southeast, south, southwest, west, northwest]
                sun_period:
                  type: string
                  nullable: true
                  enum: [morning, afternoon, full_day]
                amenity_ids:
                  type: array
                  items:
                    type: integer
                  description: Active amenity catalog IDs to attach to the building
      responses:
        '201':
          description: Created as unpublished wizard draft (`wizard_step` defaults to 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/builder/amenities:
    get:
      summary: List active amenities catalog for the builder
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active amenities ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Amenity'
        '401':
          description: Unauthenticated
        '403':
          description: Missing buildings.view
  /api/builder/cep/{cep}:
    get:
      summary: Lookup address by CEP (ViaCEP proxy)
      security:
        - bearerAuth: []
      parameters:
        - name: cep
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Address found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CepAddress'
        '404':
          description: CEP not found
        '422':
          description: Invalid CEP
        '503':
          description: ViaCEP unavailable
  /api/builder/buildings/{building}:
    get:
      summary: Show building with towers, units and units_summary
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Building detail including amenities; nested units expose amenities (union), inherited_amenities, extra_amenities, resolved_defaults and INCC-M display `price`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '404':
          description: Not found
    patch:
      summary: Update building identity, description or publish flag
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                seo_title:
                  type: string
                  nullable: true
                seo_description:
                  type: string
                  nullable: true
                published:
                  type: boolean
                  description: false keeps the wizard draft; true publishes and sets wizard_completed_at
                wizard_step:
                  type: integer
                  minimum: 1
                  maximum: 4
                zip:
                  type: string
                  nullable: true
                street:
                  type: string
                  nullable: true
                number:
                  type: string
                  nullable: true
                complement:
                  type: string
                  nullable: true
                neighborhood:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                ceiling_type:
                  type: string
                  nullable: true
                  enum: [plaster, pvc, wood, concrete, none]
                opening_type:
                  type: string
                  nullable: true
                  enum: [aluminum, wood, pvc, steel]
                flooring_type:
                  type: string
                  nullable: true
                  enum: [porcelain, ceramic, wood, vinyl, laminate, polished_concrete]
                solar_position:
                  type: string
                  nullable: true
                  enum: [north, northeast, east, southeast, south, southwest, west, northwest]
                sun_period:
                  type: string
                  nullable: true
                  enum: [morning, afternoon, full_day]
                amenity_ids:
                  type: array
                  items:
                    type: integer
                  description: Replaces building amenities. Omit to leave unchanged. Empty array clears. Inactive IDs return 422.
      responses:
        '200':
          description: Building updated with amenities and, for nested units, union DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '422':
          description: Validation error (including publish without price on available units)
  /api/builder/buildings/{building}/structure:
    put:
      summary: Replace towers and floors (draft wizard step 2)
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [towers]
              properties:
                towers:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [name, floors_count]
                    properties:
                      name:
                        type: string
                      floors_count:
                        type: integer
                        minimum: 1
                        maximum: 80
      responses:
        '200':
          description: Building with replaced towers and floors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Building is published or wizard is completed
        '422':
          description: Validation error
  /api/builder/buildings/{building}/unit-grid:
    put:
      summary: Replace unit grid (draft wizard step 3)
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [towers]
              properties:
                towers:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, floors]
                    properties:
                      id:
                        type: integer
                      floors:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required: [number, kind, units]
                          properties:
                            number:
                              type: integer
                            kind:
                              type: string
                              enum: [residential, commercial]
                            units:
                              type: array
                              minItems: 1
                              items:
                                type: object
                                required: [code]
                                properties:
                                  code:
                                    type: string
                                  area_m2:
                                    type: number
                                    nullable: true
                                    description: Private area in m²; same typical position (101, 201, 301) usually shares this value
                                  private_area_m2:
                                    type: number
                                    nullable: true
                                  total_area_m2:
                                    type: number
                                    nullable: true
                                  bedrooms:
                                    type: integer
                                    nullable: true
                                  bathrooms:
                                    type: integer
                                    nullable: true
                                  suites:
                                    type: integer
                                    nullable: true
                                  powder_rooms:
                                    type: integer
                                    nullable: true
                                  balconies:
                                    type: integer
                                    nullable: true
                                  price:
                                    type: number
                                    nullable: true
                                    description: Alias of price_base on write.
                                  price_base:
                                    type: number
                                    nullable: true
                                  price_competence:
                                    type: string
                                    format: date
                                    nullable: true
                                  property_position:
                                    type: string
                                    nullable: true
                                    enum: [corner, front, rear]
                                  solar_position:
                                    type: string
                                    nullable: true
                                    enum: [north, northeast, east, southeast, south, southwest, west, northwest]
                                  sun_period:
                                    type: string
                                    nullable: true
                                    enum: [morning, afternoon, full_day]
                                  ceiling_type:
                                    type: string
                                    nullable: true
                                    enum: [plaster, pvc, wood, concrete, none]
                                  opening_type:
                                    type: string
                                    nullable: true
                                    enum: [aluminum, wood, pvc, steel]
                                  flooring_type:
                                    type: string
                                    nullable: true
                                    enum: [porcelain, ceramic, wood, vinyl, laminate, polished_concrete]
                                  amenity_ids:
                                    type: array
                                    items:
                                      type: integer
                                    description: Extra amenities on the unit. Building amenities are ignored and not copied to unit_amenity.
      responses:
        '200':
          description: Building with generated units. Building amenities are not copied onto unit_amenity; nested units still expose the union DTO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Building is published or wizard is completed
        '422':
          description: Validation error (empty floor, missing tower/floor, duplicate codes)
  /api/builder/buildings/{building}/generate-description:
    post:
      summary: Generate building description with the configured LLM (Gemini or OpenAI)
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Generated text (not persisted until PATCH)
          content:
            application/json:
              schema:
                type: object
                required: [description]
                properties:
                  description:
                    type: string
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '422':
          description: Provider unavailable, missing key, or generation failed
  /api/builder/buildings/{building}/towers:
    get:
      summary: List towers for building
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Towers with units_summary
    post:
      summary: Create tower
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}/towers/{tower}:
    get:
      summary: Show tower with units and units_summary
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: tower
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tower detail
        '404':
          description: Not found
    put:
      summary: Update tower
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete tower
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '422':
          description: Tower has units
  /api/builder/buildings/{building}/units:
    get:
      summary: List units
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list with amenities union, inherited_amenities, extra_amenities, resolved_defaults and INCC-M display `price`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
    post:
      summary: Create unit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tower_id, code]
              properties:
                tower_id:
                  type: integer
                code:
                  type: string
                floor:
                  type: integer
                  nullable: true
                area_m2:
                  type: number
                  nullable: true
                private_area_m2:
                  type: number
                  nullable: true
                total_area_m2:
                  type: number
                  nullable: true
                bedrooms:
                  type: integer
                  nullable: true
                bathrooms:
                  type: integer
                  nullable: true
                suites:
                  type: integer
                  nullable: true
                powder_rooms:
                  type: integer
                  nullable: true
                balconies:
                  type: integer
                  nullable: true
                price:
                  type: number
                  nullable: true
                  description: Write stores the base amount (mirrored into price_base). Responses expose the INCC-M display price instead.
                price_base:
                  type: number
                  nullable: true
                price_competence:
                  type: string
                  format: date
                  nullable: true
                status:
                  type: string
                  enum: [available, pre_reserved, reserved, sold, unavailable]
                property_position:
                  type: string
                  nullable: true
                  enum: [corner, front, rear]
                solar_position:
                  type: string
                  nullable: true
                  enum: [north, northeast, east, southeast, south, southwest, west, northwest]
                sun_period:
                  type: string
                  nullable: true
                  enum: [morning, afternoon, full_day]
                ceiling_type:
                  type: string
                  nullable: true
                  enum: [plaster, pvc, wood, concrete, none]
                opening_type:
                  type: string
                  nullable: true
                  enum: [aluminum, wood, pvc, steel]
                flooring_type:
                  type: string
                  nullable: true
                  enum: [porcelain, ceramic, wood, vinyl, laminate, polished_concrete]
                amenity_ids:
                  type: array
                  items:
                    type: integer
                  description: Extra amenities on the unit. IDs already on the building are ignored (not stored on unit_amenity and not 422).
      responses:
        '201':
          description: Created with amenities union, inherited_amenities, extra_amenities, resolved_defaults, calculated `price`, `price_base`, `price_competence` and `price_incc_current`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/builder/buildings/{building}/units/{unit}:
    get:
      summary: Show unit
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: unit
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Unit with amenities union and INCC-M display `price`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '404':
          description: Not found
    patch:
      summary: Update unit spec sheet, price-base or status
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: unit
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitWrite'
      responses:
        '200':
          description: Updated with amenities union and INCC-M display `price`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '422':
          description: Validation error
    delete:
      summary: Delete unit
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: unit
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/builder/buildings/{building}/media:
    get:
      summary: List building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
            enum: [internal, external, floor_plan]
      responses:
        '200':
          description: Media list
    post:
      summary: Upload building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                  enum: [internal, external, floor_plan]
                published:
                  type: boolean
      responses:
        '201':
          description: Created
        '422':
          description: Validation error
  /api/builder/buildings/{building}/media/{media}:
    patch:
      summary: Update building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
        '422':
          description: Validation error
    delete:
      summary: Delete building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /api/builder/buildings/{building}/media/{media}/file:
    get:
      summary: Stream building media file
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
  /api/builder/invites:
    get:
      summary: List broker invites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invites with status and invite_url
    post:
      summary: Create broker invite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel]
              properties:
                name:
                  type: string
                channel:
                  type: string
                  enum: [email, whatsapp]
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        '201':
          description: Created with invite_url; dispatched via selected channel
  /api/builder/invites/{invite}/resend:
    post:
      summary: Resend broker invite
      security:
        - bearerAuth: []
      parameters:
        - name: invite
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resent with new token and updated last_sent_at
  /api/builder/invites/{invite}:
    delete:
      summary: Cancel pending broker invite
      security:
        - bearerAuth: []
      parameters:
        - name: invite
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /api/builder/invite-link:
    get:
      summary: Get or create tenant shareable invite link
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invite link with invite_url
  /api/builder/invite-link/regenerate:
    post:
      summary: Regenerate tenant shareable invite link token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New invite link
  /api/builder/pending-brokers:
    get:
      summary: List brokers pending approval from open invite link
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending broker requests
  /api/builder/pending-brokers/{brokerTenant}/approve:
    post:
      summary: Approve pending broker from open invite link
      security:
        - bearerAuth: []
      parameters:
        - name: brokerTenant
          in: path
          required: true
          schema:
            type: integer
      responses:
