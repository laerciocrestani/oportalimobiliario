  /api/builder/reservations/{reservation}/proposal/decision:
    patch:
      summary: Decide on reservation proposal (builder)
      description: |
        Accept, reject, or return the pending proposal. Accept requires multipart
        `signed_file` (PDF signed by the builder). Reject/return remain JSON and require `decision_note`.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [accepted, rejected, returned]
                decision_note:
                  type: string
                  maxLength: 2000
                  nullable: true
                  description: Required when decision is rejected or returned.
          multipart/form-data:
            schema:
              type: object
              required:
                - decision
                - signed_file
              properties:
                decision:
                  type: string
                  enum: [accepted]
                decision_note:
                  type: string
                signed_file:
                  type: string
                  format: binary
                  description: PDF signed by the builder. Required when decision is accepted.
      responses:
        '200':
          description: Decision recorded
        '403':
          description: Forbidden
        '422':
          description: Invalid stage, missing signed PDF on accept, or validation error
    post:
      summary: Accept proposal with builder-signed PDF (multipart)
      description: Same handler as PATCH decision. Use POST multipart for `signed_file` on accept.
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [decision, signed_file]
              properties:
                decision:
                  type: string
                  enum: [accepted]
                signed_file:
                  type: string
                  format: binary
                decision_note:
                  type: string
      responses:
        '200':
          description: Proposal accepted
        '403':
          description: Forbidden
        '422':
          description: Missing signed PDF or invalid stage
