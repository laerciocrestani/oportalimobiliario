          description: Event received
  /api/admin/tenants:
    get:
      summary: List tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated tenants
    post:
      summary: Create tenant
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/admin/tenants/{tenant}:
    get:
      summary: Show tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tenant with users_count
    put:
      summary: Update tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated tenant
        '422':
          description: Validation error
  /api/admin/tenants/{tenant}/users:
    get:
      summary: List builder users for tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Builder team members
        '403':
          description: Forbidden
  /api/admin/tenants/{tenant}/impersonate:
    post:
      summary: Generate one-time impersonation redirect URL
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: integer
      responses:
        '200':
          description: Redirect URL with one-time code
        '422':
          description: Invalid user or inactive tenant
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ReservationTimelineStep:
      type: object
      properties:
        key:
          type: string
          example: deposit_window
        label:
          type: string
          example: Aguardando sinal (48h)
        status:
          type: string
          enum: [completed, current, upcoming, skipped, failed]
        occurred_at:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        actor:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            role:
              type: string
        actions:
          type: array
          items:
            type: string
    ReservationTimeline:
      type: object
      properties:
        reservation_id:
          type: integer
        current_stage:
          type: string
          example: deposit_pending
        expires_at:
          type: string
          format: date-time
          nullable: true
        deposit_overdue:
          type: boolean
        unit:
          type: object
          properties:
            id:
              type: integer
            code:
              type: string
            status:
              type: string
        current_proposal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReservationProposal'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReservationTimelineStep'
    ReservationProposalInput:
      type: object
      required:
        - client_name
        - client_email
        - client_phone
        - client_cpf
        - address
        - city
        - state
        - zip
        - marital_status
        - nationality
        - land_value
        - payment_terms
      properties:
        client_name:
          type: string
        client_email:
          type: string
        client_phone:
          type: string
        client_cpf:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        marital_status:
          type: string
        nationality:
          type: string
        land_value:
          type: number
          format: double
        payment_terms:
          type: string
          maxLength: 2000
    ReservationProposal:
      allOf:
        - $ref: '#/components/schemas/ReservationProposalInput'
        - type: object
          properties:
            id:
              type: integer
            version:
              type: integer
            decision:
              type: string
              nullable: true
              enum: [accepted, rejected, returned]
            decision_note:
              type: string
              nullable: true
            submitted_by:
              type: integer
            decided_by:
              type: integer
              nullable: true
            decided_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
              nullable: true
