openapi: 3.1.0
info:
  title: Oportalimobiliário API
  version: 0.4.0
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/public/buildings:
    get:
      summary: List published buildings (no auth)
      responses:
        '200':
          description: List of buildings with cheapest unit and cover image
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    slug:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    city:
                      type: string
                      nullable: true
                    state:
                      type: string
                      nullable: true
                    seo_title:
                      type: string
                      nullable: true
                    seo_description:
                      type: string
                      nullable: true
                    units_count:
                      type: integer
                    cheapest_unit:
                      type: object
                      nullable: true
                      properties:
                        code:
                          type: string
                        price:
                          type: string
                        area_m2:
                          type: string
                          nullable: true
                        floor:
                          type: integer
                          nullable: true
                    cover_image:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: integer
                        url:
                          type: string
  /api/public/buildings/{slug}:
    get:
      summary: Show published building by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Building detail
        '404':
          description: Not found
  /api/public/buildings/{slug}/media:
    get:
      summary: List published building media (internal/external only)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published media list
        '404':
          description: Building not found or not published
  /api/public/buildings/{slug}/media/{media}/file:
    get:
      summary: Stream published building media file
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
        '404':
          description: Not found
  /api/public/sitemap.xml:
    get:
      summary: Public sitemap XML
      responses:
        '200':
          description: Sitemap XML
          content:
            application/xml:
              schema:
                type: string
  /api/public/robots.txt:
    get:
      summary: Public robots.txt
      responses:
        '200':
          description: Robots rules
          content:
            text/plain:
              schema:
                type: string
  /api/auth/login:
    post:
      summary: Login
      responses:
        '200':
          description: Token issued
        '422':
          description: Invalid credentials
  /api/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthenticated
  /api/auth/impersonate/exchange:
    post:
      summary: Exchange one-time impersonation code for builder token (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Token issued for impersonated builder user
        '422':
          description: Invalid or expired code
  /api/builder/buildings:
    get:
      summary: List buildings (builder role)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant-scoped list with units_summary per building
    post:
      summary: Create building
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}:
    get:
      summary: Show building with towers, units and units_summary
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Building detail
        '404':
          description: Not found
  /api/builder/buildings/{building}/towers:
    get:
      summary: List towers for building
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Towers with units_summary
    post:
      summary: Create tower
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}/towers/{tower}:
    get:
      summary: Show tower with units and units_summary
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: tower
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tower detail
        '404':
          description: Not found
    put:
      summary: Update tower
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete tower
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '422':
          description: Tower has units
  /api/builder/buildings/{building}/units:
    get:
      summary: List units
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list
    post:
      summary: Create unit
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}/media:
    get:
      summary: List building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
            enum: [internal, external, floor_plan]
      responses:
        '200':
          description: Media list
    post:
      summary: Upload building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                  enum: [internal, external, floor_plan]
                published:
                  type: boolean
      responses:
        '201':
          description: Created
        '422':
          description: Validation error
  /api/builder/buildings/{building}/media/{media}:
    patch:
      summary: Update building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
        '422':
          description: Validation error
    delete:
      summary: Delete building media
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /api/builder/buildings/{building}/media/{media}/file:
    get:
      summary: Stream building media file
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
  /api/builder/invites:
    get:
      summary: List broker invites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invites with status and invite_url
    post:
      summary: Create broker invite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel]
              properties:
                name:
                  type: string
                channel:
                  type: string
                  enum: [email, whatsapp]
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        '201':
          description: Created with invite_url; dispatched via selected channel
  /api/builder/invites/{invite}/resend:
    post:
      summary: Resend broker invite
      security:
        - bearerAuth: []
      parameters:
        - name: invite
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resent with new token and updated last_sent_at
  /api/builder/invites/{invite}:
    delete:
      summary: Cancel pending broker invite
      security:
        - bearerAuth: []
      parameters:
        - name: invite
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /api/builder/invite-link:
    get:
      summary: Get or create tenant shareable invite link
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invite link with invite_url
  /api/builder/invite-link/regenerate:
    post:
      summary: Regenerate tenant shareable invite link token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New invite link
  /api/builder/pending-brokers:
    get:
      summary: List brokers pending approval from open invite link
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending broker requests
  /api/builder/pending-brokers/{brokerTenant}/approve:
    post:
      summary: Approve pending broker from open invite link
      security:
        - bearerAuth: []
      parameters:
        - name: brokerTenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Broker approved
  /api/builder/pending-brokers/{brokerTenant}/reject:
    post:
      summary: Reject pending broker from open invite link
      security:
        - bearerAuth: []
      parameters:
        - name: brokerTenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Request rejected
  /api/builder/brokers:
    get:
      summary: List linked brokers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brokers with buildings_count and buildings summary
  /api/builder/brokers/{broker}/buildings:
    get:
      summary: List buildings granted to broker
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Granted buildings
    post:
      summary: Grant broker access to building (all units)
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
        '403':
          description: Missing access.manage permission
    delete:
      summary: Revoke broker access to building
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Revoked
  /api/builder/team:
    get:
      summary: List builder team members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team members with permissions
        '403':
          description: Missing team.manage permission
    post:
      summary: Create builder team member
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
        '403':
          description: Missing team.manage permission
        '422':
          description: Validation error
  /api/builder/team/{teamMember}:
    patch:
      summary: Update builder team member
      security:
        - bearerAuth: []
      parameters:
        - name: teamMember
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
        '422':
          description: Validation error
    delete:
      summary: Remove builder team member
      security:
        - bearerAuth: []
      parameters:
        - name: teamMember
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden
        '422':
          description: Cannot remove last team manager
  /api/builder/reservations:
    get:
      summary: List reservations (builder)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservations list
        '403':
          description: Missing reservations.cancel permission
  /api/builder/reservations/pending-replies-count:
    get:
      summary: Count reservations awaiting builder reply
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending reply count
        '403':
          description: Missing reservations.cancel permission
  /api/builder/reservations/{reservation}/messages:
    get:
      summary: List reservation messages (builder)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Messages thread
        '403':
          description: Forbidden
    post:
      summary: Reply on reservation thread (builder)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Message created
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/builder/reservations/{reservation}:
    delete:
      summary: Cancel reservation (builder)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cancelled
        '403':
          description: Missing reservations.cancel permission
  /api/broker/clients:
    get:
      summary: List broker clients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clients list
    post:
      summary: Create broker client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Created
  /api/broker/units:
    get:
      summary: List units by access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list
  /api/broker/buildings/{building}/media:
    get:
      summary: List building media for broker with access
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media list including floor plans
        '403':
          description: Forbidden
  /api/broker/buildings/{building}/media/{media}/file:
    get:
      summary: Stream building media file for broker
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: media
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file stream
  /api/broker/reservations:
    get:
      summary: List broker reservations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservations list for authenticated broker
    post:
      summary: Create soft reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_id
                - client_id
              properties:
                unit_id:
                  type: integer
                client_id:
                  type: integer
                observations:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '201':
          description: Created
  /api/broker/reservations/pending-replies-count:
    get:
      summary: Count reservations awaiting broker reply
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending reply count
  /api/broker/reservations/{reservation}/messages:
    get:
      summary: List reservation messages (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Messages thread
        '403':
          description: Not the reservation owner
    post:
      summary: Reply on reservation thread (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Message created
        '403':
          description: Not the reservation owner
        '422':
          description: Validation error
  /api/broker/reservations/{reservation}:
    delete:
      summary: Cancel reservation (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Reservation cancelled
        '403':
          description: Not the reservation owner
  /api/broker/invites/preview:
    get:
      summary: Preview broker invite (public)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite preview
        '422':
          description: Invalid or expired
  /api/broker/invites/accept:
    post:
      summary: Accept broker invite and create account (public)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Accepted with auth token
  /api/broker/join/preview:
    get:
      summary: Preview open invite link (public)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Open link preview
        '422':
          description: Invalid link
  /api/broker/join/register:
    post:
      summary: Register broker via open invite link (public)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, name, phone, password]
              properties:
                token:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '201':
          description: Registered with auth token; pending builder approval
  /api/public/whatsapp/webhook:
    get:
      summary: Meta WhatsApp webhook verification
      responses:
        '200':
          description: Challenge echoed
    post:
      summary: Meta WhatsApp webhook events
      responses:
        '200':
          description: Event received
  /api/admin/tenants:
    get:
      summary: List tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated tenants
    post:
      summary: Create tenant
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/admin/tenants/{tenant}:
    get:
      summary: Show tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tenant with users_count
    put:
      summary: Update tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated tenant
        '422':
          description: Validation error
  /api/admin/tenants/{tenant}/users:
    get:
      summary: List builder users for tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Builder team members
        '403':
          description: Forbidden
  /api/admin/tenants/{tenant}/impersonate:
    post:
      summary: Generate one-time impersonation redirect URL
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: integer
      responses:
        '200':
          description: Redirect URL with one-time code
        '422':
          description: Invalid user or inactive tenant
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
