openapi: 3.1.0
info:
  title: Oportalimobiliário API
  version: 0.2.0
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/public/empreendimentos:
    get:
      summary: List published empreendimentos (no auth)
      responses:
        '200':
          description: List of empreendimentos
  /api/public/empreendimentos/{id}:
    get:
      summary: Show published empreendimento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Empreendimento detail
        '404':
          description: Not found
  /api/auth/login:
    post:
      summary: Login
      responses:
        '200':
          description: Token issued
        '422':
          description: Invalid credentials
  /api/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthenticated
  /api/construtora/empreendimentos:
    get:
      summary: List empreendimentos (construtora)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant-scoped list
    post:
      summary: Create empreendimento
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/construtora/empreendimentos/{empreendimento}/unidades:
    get:
      summary: List unidades
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unidades list
    post:
      summary: Create unidade
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/construtora/convites:
    post:
      summary: Create corretor invite
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/construtora/acessos:
    post:
      summary: Grant corretor access to unidade
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/corretor/unidades:
    get:
      summary: List unidades by acesso
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unidades list
  /api/corretor/reservas:
    post:
      summary: Create soft reserva
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/corretor/convites/accept:
    post:
      summary: Accept corretor invite
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accepted
  /api/admin/tenants:
    get:
      summary: List tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated tenants
    post:
      summary: Create tenant
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
