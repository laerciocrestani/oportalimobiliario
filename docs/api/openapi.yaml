      type: object
      properties:
        key:
          type: string
          example: proposal_decision
        label:
          type: string
          example: Decisão do gestor
        occurred_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-10T19:00:00+00:00'
    ReservationSituation:
      type: object
      properties:
        previous:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReservationSituationStep'
        current:
          allOf:
            - $ref: '#/components/schemas/ReservationSituationStep'
            - type: object
              properties:
                status:
                  type: string
                  enum: [current, failed, completed]
                  example: current
                waiting_on:
                  type: string
                  nullable: true
                  enum: [broker, builder]
                  description: Who must act on the current gate (corretor or construtora).
                  example: builder
        next:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReservationSituationStep'
    ReservationListItem:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        messages_count:
          type: integer
        needs_reply:
          type: boolean
        needs_proposal_decision:
          type: boolean
        needs_deposit_proof_approval:
          type: boolean
        deposit_overdue:
          type: boolean
        situation:
          $ref: '#/components/schemas/ReservationSituation'
        client:
          type: object
          nullable: true
        broker:
          type: object
          nullable: true
        unit:
          type: object
          nullable: true
    ReservationTimelineStep:
      type: object
      properties:
        key:
          type: string
          example: deposit_window
        label:
          type: string
          example: Aguardando sinal (48h)
        status:
          type: string
          enum: [completed, current, upcoming, skipped, failed]
        occurred_at:
          type: string
          format: date-time
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        actor:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            role:
              type: string
        actions:
          type: array
          items:
            type: string
    ReservationTimeline:
      type: object
      properties:
        reservation_id:
          type: integer
        current_stage:
          type: string
          example: deposit_pending
        expires_at:
          type: string
          format: date-time
          nullable: true
        deposit_overdue:
          type: boolean
        unit:
          type: object
          properties:
            id:
              type: integer
            code:
              type: string
            status:
              type: string
        current_proposal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReservationProposal'
        current_deposit_proof:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReservationAttachment'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ReservationAttachment'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReservationTimelineStep'
    ReservationAttachment:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [deposit_proof, contract_documentation, contract_pdf, contract_signed]
        original_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        uploaded_by:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        file_url:
          type: string
    ReservationProposalInput:
      type: object
      required:
        - client_name
        - client_email
        - client_phone
        - client_cpf
        - address
        - city
        - state
        - zip
        - marital_status
        - nationality
        - land_value
        - payment_terms
      properties:
        client_name:
          type: string
        client_email:
          type: string
        client_phone:
          type: string
        client_cpf:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        marital_status:
          type: string
        nationality:
          type: string
        land_value:
          type: number
          format: double
        payment_terms:
          type: string
          maxLength: 2000
    ReservationProposal:
      allOf:
        - $ref: '#/components/schemas/ReservationProposalInput'
        - type: object
          properties:
            id:
              type: integer
            version:
              type: integer
            decision:
              type: string
              nullable: true
              enum: [accepted, rejected, returned]
            decision_note:
              type: string
              nullable: true
            submitted_by:
              type: integer
            decided_by:
              type: integer
              nullable: true
            decided_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
              nullable: true
