openapi: 3.1.0
info:
  title: Oportalimobiliário API
  version: 0.4.0
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/public/buildings:
    get:
      summary: List published buildings (no auth)
      responses:
        '200':
          description: List of buildings
  /api/public/buildings/{id}:
    get:
      summary: Show published building
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Building detail
        '404':
          description: Not found
  /api/auth/login:
    post:
      summary: Login
      responses:
        '200':
          description: Token issued
        '422':
          description: Invalid credentials
  /api/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthenticated
  /api/builder/buildings:
    get:
      summary: List buildings (builder role)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant-scoped list with units_summary per building
    post:
      summary: Create building
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}:
    get:
      summary: Show building with towers, units and units_summary
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Building detail
        '404':
          description: Not found
  /api/builder/buildings/{building}/towers:
    get:
      summary: List towers for building
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Towers with units_summary
    post:
      summary: Create tower
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}/towers/{tower}:
    get:
      summary: Show tower with units and units_summary
      security:
        - bearerAuth: []
      parameters:
        - name: building
          in: path
          required: true
          schema:
            type: integer
        - name: tower
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tower detail
        '404':
          description: Not found
    put:
      summary: Update tower
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete tower
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '422':
          description: Tower has units
  /api/builder/buildings/{building}/units:
    get:
      summary: List units
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list
    post:
      summary: Create unit
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/invites:
    get:
      summary: List broker invites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invites with status and invite_url
    post:
      summary: Create broker invite
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created with invite_url; email sent
  /api/builder/invites/{invite}/resend:
    post:
      summary: Resend broker invite
      security:
        - bearerAuth: []
      parameters:
        - name: invite
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resent with new token
  /api/builder/invites/{invite}:
    delete:
      summary: Cancel pending broker invite
      security:
        - bearerAuth: []
      parameters:
        - name: invite
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /api/builder/brokers:
    get:
      summary: List linked brokers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brokers with accepted invites
  /api/builder/brokers/{broker}/buildings:
    get:
      summary: List buildings granted to broker
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Granted buildings
    post:
      summary: Grant broker access to building (all units)
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
        '403':
          description: Missing access.manage permission
    delete:
      summary: Revoke broker access to building
      security:
        - bearerAuth: []
      parameters:
        - name: broker
          in: path
          required: true
          schema:
            type: integer
        - name: building
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Revoked
  /api/builder/team:
    get:
      summary: List builder team members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team members with permissions
        '403':
          description: Missing team.manage permission
    post:
      summary: Create builder team member
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
        '403':
          description: Missing team.manage permission
        '422':
          description: Validation error
  /api/builder/team/{teamMember}:
    patch:
      summary: Update builder team member
      security:
        - bearerAuth: []
      parameters:
        - name: teamMember
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
        '422':
          description: Validation error
    delete:
      summary: Remove builder team member
      security:
        - bearerAuth: []
      parameters:
        - name: teamMember
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden
        '422':
          description: Cannot remove last team manager
  /api/builder/reservations/{reservation}:
    delete:
      summary: Cancel reservation (builder)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cancelled
        '403':
          description: Missing reservations.cancel permission
  /api/broker/clients:
    get:
      summary: List broker clients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clients list
    post:
      summary: Create broker client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Created
  /api/broker/units:
    get:
      summary: List units by access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list
  /api/broker/reservations:
    post:
      summary: Create soft reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_id
                - client_id
              properties:
                unit_id:
                  type: integer
                client_id:
                  type: integer
      responses:
        '201':
          description: Created
  /api/broker/reservations/{reservation}:
    delete:
      summary: Cancel reservation (broker)
      security:
        - bearerAuth: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Reservation cancelled
        '403':
          description: Not the reservation owner
  /api/broker/invites/preview:
    get:
      summary: Preview broker invite (public)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite preview
        '422':
          description: Invalid or expired
  /api/broker/invites/accept:
    post:
      summary: Accept broker invite and create account (public)
      responses:
        '200':
          description: Accepted with auth token
  /api/admin/tenants:
    get:
      summary: List tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated tenants
    post:
      summary: Create tenant
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
