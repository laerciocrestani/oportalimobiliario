openapi: 3.1.0
info:
  title: Oportalimobiliário API
  version: 0.3.0
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/public/buildings:
    get:
      summary: List published buildings (no auth)
      responses:
        '200':
          description: List of buildings
  /api/public/buildings/{id}:
    get:
      summary: Show published building
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Building detail
        '404':
          description: Not found
  /api/auth/login:
    post:
      summary: Login
      responses:
        '200':
          description: Token issued
        '422':
          description: Invalid credentials
  /api/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthenticated
  /api/builder/buildings:
    get:
      summary: List buildings (builder role)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant-scoped list
    post:
      summary: Create building
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/buildings/{building}/units:
    get:
      summary: List units
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list
    post:
      summary: Create unit
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/invites:
    post:
      summary: Create broker invite
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/builder/access:
    post:
      summary: Grant broker access to unit
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/broker/units:
    get:
      summary: List units by access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Units list
  /api/broker/reservations:
    post:
      summary: Create soft reservation
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/broker/invites/accept:
    post:
      summary: Accept broker invite
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accepted
  /api/admin/tenants:
    get:
      summary: List tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated tenants
    post:
      summary: Create tenant
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
