    <text x="650" y="290">Dormitório 2</text>
    <text x="650" y="308" fill="#1b1814">11 m²</text>
    <text x="554" y="430">Dormitório 3</text>
    <text x="554" y="450" fill="#1b1814">10 m²</text>
    <text x="682" y="430">Banho</text>
    <text x="682" y="450" fill="#1b1814">4 m²</text>
    <text x="400" y="470">Lavabo</text>
